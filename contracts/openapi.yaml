      operationId: listNotifications
      summary: List owned persistent in-app inbox
      description: List owned persistent in-app inbox
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            description: Zero-based decimal offset. Omit for first page; invalid cursors rejected.
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
