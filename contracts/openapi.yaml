        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "423":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      x-roles:
        - STUDENT
        - STAFF
    post:
      operationId: intakeParcel
      summary: Save physical intake and evaluate trustworthy matching
      description: Camera returns untrusted text only; fields must be classified and labelReviewed true.
        physicalReference uniquely identifies a physical parcel (not an order or shared tracking);
        duplicate intake returns 409 DUPLICATE_INTAKE. Save RECEIVED audit then resolve to
        AWAITING_MATCH or AWAITING_COLLECTION. Matching requires same kind, namespace and trimmed
        value normalized according to the explicit platform/carrier policy, exactly one unconflicted candidate, email or student-number
        corroboration and no conflicting supplied recipient or comparable identifier. Name alone
        never suffices. OTHER platform or a match only in the generic OTHER carrier namespace cannot
        auto-match. Separate physical references support split shipments. Required idempotencyKey.
        Scope is authenticated principal + operationId + key; canonical fingerprint includes path
        and semantic JSON body except the key, with sorted object keys. For 24 hours, same request
        replays the original response without repeating side effects, even if the current resource
        revision has changed; different body/path gives 409 IDEMPOTENCY_CONFLICT. Only successful
        writes retain results; validation/authorization/state errors do not reserve a key. Expired
        result entries may be removed and a later request treated as fresh, subject to domain
        constraints; clients must use a new key after 24 hours. Backend must commit resource changes
        and idempotency result together. A retry that changes data requires an explicit new
        operation and key, not silent mutation of an uncertain request. A normalized
        carrier/tracking value found on another physical reference, including a closed historical
        parcel, is TRACKING_COLLISION. Save the new physical record unassigned as
        AWAITING_MATCH/REVIEW; hold affected uncollected assignments as DISPUTE and invalidate
        credentials. Never alter closed history. Staff must explicitly document a resolution for
        each affected uncollected parcel. A reviewed collision resolution remains valid only for the
        recorded collision membership/evidence. Sharing a merchant order ID alone is allowed for
        split shipments.
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
