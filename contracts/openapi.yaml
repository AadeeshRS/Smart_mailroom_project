      description: Students see only linked parcels they own, staff see all. Filters combine by AND;
        stable descending receivedAt/id order. Closed records retained.
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
            description: "Opaque principal/operation/filter/limit-bound snapshot continuation, expires 15
              minutes after first page. Invalid, expired or mismatched cursor: 400 CURSOR_INVALID."
        - name: limit
          in: query
          schema:
            type: integer
