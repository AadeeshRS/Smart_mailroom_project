  responses:
    Error:
      description: "Error envelope. HTTP mapping: 400 validation; 401 authentication/session; 403 role;
        404 resource absent or not owned; 409 duplicate, lifecycle, revision, idempotency or
        concurrent conflict; 410 expired credential/verification; 423 collection hold; 429 five
        failed OTP attempts; 503 network/persistence. Operation descriptions define specific codes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
          examples:
            IDEMPOTENCY_CONFLICT:
              $ref: "#/components/examples/IDEMPOTENCY_CONFLICT"
            VERIFICATION_EXPIRED:
              $ref: "#/components/examples/VERIFICATION_EXPIRED"
            COLLECTION_HOLD:
              $ref: "#/components/examples/COLLECTION_HOLD"
            DUPLICATE_INTAKE:
              $ref: "#/components/examples/DUPLICATE_INTAKE"
            UNKNOWN_NAMESPACE:
              $ref: "#/components/examples/UNKNOWN_NAMESPACE"
            ISSUANCE_RETRY_UNAVAILABLE:
              $ref: "#/components/examples/ISSUANCE_RETRY_UNAVAILABLE"
            CURSOR_INVALID:
              $ref: "#/components/examples/CURSOR_INVALID"
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
              - no-store
          description: Required on all sensitive errors, including authentication and credential errors.
