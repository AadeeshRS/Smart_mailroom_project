openapi: 3.0.3
info:
  title: Smart Mailroom - FROZEN — APPROVED INTEGRATION CONTRACT
  version: 0.2.0
  description: >-
    FROZEN — APPROVED INTEGRATION CONTRACT. Reviewer-approved API version 0.2.0; methods, schemas and business semantics are frozen. Simple REST/JSON API; development-only provisioned authentication, bearer
    demo sessions last 30 minutes. Production must omit demo login/reset. Roles and ownership
    enforced at the service boundary; not-owned resources return NOT_FOUND. Backend IDs are prefixed
    opaque cryptographically random values, never predictable frontend counters. UTC RFC3339
    response timestamps end in Z. No backend, SSO or provider integration exists.


    Pagination: first page freezes authorized matching membership and ordering for 15 minutes. Lists
    sort createdAt/receivedAt/confirmedAt descending, then opaque id descending; candidates sort
    comparable first then createdAt/id descending. Cursor is opaque, signed/unforgeable on a backend
    and bound to principal, operation, filters, limit and snapshot. Concurrent inserts are excluded
    until a new first-page request; updates are returned as current projections,
    deleted/no-longer-authorized members are omitted without admitting new members. Filter
    membership/order remains frozen. A cursor expires after 15 minutes, cannot cross
    accounts/filters/limits, and may be rejected after mock restart: CURSOR_INVALID. No offset
    pagination. Default 20/max 100; candidates max 50. Search max 100 characters, case-insensitive
    substring over documented fields. No cursor grants authorization; recheck ownership on every
    page.


    Writes: createOrder/intakeParcel/reconcileParcel require principal+operation+key idempotency
    with sorted-key semantic fingerprint, 24-hour successful-result retention. Failed writes do not
    reserve keys. After expiry a request is fresh and domain uniqueness/revision checks apply.
    addTracking is set-add idempotent; cancellation of an already-cancelled owned order returns it;
    readNotification preserves first readAt. Hold changes require expectedRevision; replay after
    uncertain hold change requires a read and deliberate new revision/decision. Confirmation
    mappings are retained with permanent receipts and replay before expiry checks. Issuance replay
    is available only with volatile original secrets/current session, otherwise explicit new-key
    replacement is required. Details are normative in each operation. Cache-Control: no-store on all
    sensitive responses and errors.


    Matching: approved platform/carrier catalogs and normalization are defined in Platform/Carrier.
    Unknown namespaces are rejected; OTHER requires review. Independent email/student-number
    corroboration, exactly one unconflicted comparable candidate and no contradictions are required.
    A carrier/tracking collision across distinct physical references blocks auto-allocation,
    preserves every intake, holds affected uncollected assignments and requires documented review
    per parcel. Sharing only merchant order ID permits legitimate split shipments. New relevant
    evidence invalidates a reviewed decision; closed parcels never transfer. Collection eligibility
    = AWAITING_COLLECTION + linked active order/student + hold NONE. MATCHED means at least one
    linked parcel, not all shipments.


    Privacy: common/student parcel and receipt operations return explicit public projections without
    label evidence, audit actors, internal match/hold reasons or reconciliation free text. Internal
    details are staff-only operations. Public notifications and error messages must not carry
    private staff reasons. Candidate data is staff-only and bounded/searchable.


    Notifications: persist an in-app event before exposing availability, once per
    assignment/collection event; retries of successful writes do not duplicate notifications.
    Inbox/readAt survive restart; readAt is independent of delivery. This mock persists simulated
    ACCEPTED delivery only and contacts nobody. In a later backend, durable outbox attempts start
    PENDING, provider acceptance becomes ACCEPTED, authenticated provider results become DELIVERED
    or FAILED; acceptance is not delivery. Provider results are deduplicated by attempt/event ID,
    reject stale/out-of-order updates and never change parcel lifecycle/readAt. Retry creates a new
    delivery attempt, retaining previous outcome. No student/staff endpoint can assert a provider
    result. simulatedExternal must remain true for every mock event. History and handover receipts
    are retained until explicit development reset; production retention needs institutional policy
    approval before production use, not a silent implementation choice.
