              schema:
                $ref: "#/components/schemas/Parcel"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "423":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      x-roles:
        - STAFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HoldInput"
  /parcels/{parcelId}/credentials:
    post:
      operationId: issueCredential
      summary: Issue or explicitly replace parcel collection credential
      description: "Eligible owner only; ten-minute validity, one current credential. Six-digit string OTP
        and PII-free versioned QR. Same key/same body in same session replays original issuance
        while active; changed body 409 IDEMPOTENCY_CONFLICT. Different key with active credential
        and replace false: 409 CREDENTIAL_ACTIVE. replace true invalidates old OTP/QR and
        verifications. Secrets only in issuance response, never list/detail/logs. Mock keeps secrets
        in volatile memory; after restart old retry yields ISSUANCE_RETRY_UNAVAILABLE and student
        must use a fresh key/replacement. Expired/invalidated key cannot silently issue another
        credential. Backend replay/secret-retention policy needs review."
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ParcelId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "423":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      x-roles:
        - STUDENT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueInput"
  /parcels/{parcelId}/verifications:
    post:
      operationId: verifyCredential
      summary: Verify OTP or QR without consuming credential
      description: OTP requires six digits for this parcel; QR requires v=1, current credentialRef and
        opaque token for this parcel. No PII in QR. Five wrong well-formed OTP attempts invalidate
        current credential. Verification binds parcel, current credential, parcel revision and staff
        session. Expires at min(now+2 minutes, credential expiry). Does not close parcel or consume
        credential.
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ParcelId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Verification"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "423":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      x-roles:
        - STAFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyInput"
  /parcels/{parcelId}/handover:
    post:
      operationId: confirmHandover
      summary: Explicitly confirm physical handover or replay original receipt
      description: "Requires true physicalHandoverConfirmed, valid bound verification and idempotencyKey.
        Same staff account/key/body replays original retained receipt even after restart or
        verification expiry. Reusing key with changed body: 409 IDEMPOTENCY_CONFLICT. Different
        successful key for already CLOSED: ALREADY_COLLECTED; changed revision: REVISION_CHANGED;
        hold: COLLECTION_HOLD; stale competing verification: CONCURRENT_CONFLICT; expired
        verification: VERIFICATION_EXPIRED. One receipt per parcel. Backend must atomically recheck
        authorization, hold, revision, current credential, verification, update CLOSED, consume
        credential and insert receipt/idempotency record. Mock simulates serialized state changes
        only, not database safety."
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ParcelId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Confirmation"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"
        "423":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
      x-roles:
        - STAFF
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmInput"
