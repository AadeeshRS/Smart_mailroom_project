openapi: 3.0.3
info:
  title: Smart Mailroom - DRAFT — FRONTEND PROTOTYPE
  version: 0.1.0
  description: Proposed canonical contract; independent review required before backend implementation.
    No backend, SSO or notification provider exists. All IDs are typed prefixed strings; all
    response timestamps UTC. Bearer sessions enforce role and ownership at service boundary;
    resource-not-owned is NOT_FOUND. Mock authorization is illustrative, not production enforcement.
    Collection eligibility = AWAITING_COLLECTION with linked active order/student and hold NONE.
    MATCHED order means at least one linked shipment, not all arrived. Credential, hold and
    notification states are independent of parcel lifecycle. No automatic matching from names or
    cross-kind identifiers. Pagination is offset cursor, default 20 max 100, newest first; cursor
    consistency under live writes remains a backend review decision. Error status mappings in
    operation descriptions take precedence; all errors share ErrorEnvelope. External delivery states
    are simulated only, independently of inbox read state.
servers:
  - url: https://api.example.invalid/v1
    description: Placeholder only; app runs mock adapter
security:
  - bearerAuth: []
paths:
  /demo/sessions:
    post:
      operationId: login
      summary: Sign in to a fixed provisioned demonstration account
      description: Passcode is demonstration-only. Role is determined by the provisioned account; no
        client role input. Session lasts 30 minutes. No SSO or domain verification.
      parameters: []
