  /parcels/{parcelId}/credentials:
    post:
      operationId: issueCredential
      summary: Issue or explicitly replace parcel collection credential
      description: "Student owner and eligible parcel only. 6-digit OTP and PII-free QR, one current
        credential, 10 minutes. Scope principal + issueCredential + key; metadata retained 24 hours.
        Same key/body replays only while the original current unexpired credential secrets remain in
        volatile issuance memory in that same authenticated session. Replacement, expiry, session
        change or process restart makes replay unavailable: 409 ISSUANCE_RETRY_UNAVAILABLE. After 24
        hours the key may be fresh, but active-credential checks still apply. To recover explicitly
        choose replacement with replace=true and a NEW key; this invalidates prior
        OTP/QR/verification. No plaintext credential persistence is required or allowed in the mock.
        Future backend may retain an encrypted replay envelope for at most the issuance
        session/credential lifetime; hashes alone must never be presented as recoverable secrets.
        Responses and errors Cache-Control: no-store; secrets never appear in logs or list/detail
        endpoints."
