  /parcels/{parcelId}/review:
    get:
      operationId: getReview
      summary: Inspect candidate evidence; staff only
      description: Comparable candidates first, then remaining active orders for evidence-led manual
        reconciliation. Candidate profiles never exposed to student endpoints.
      parameters:
