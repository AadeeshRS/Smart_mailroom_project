              $ref: "#/components/schemas/ReconcileInput"
  /parcels/{parcelId}/hold:
    post:
      operationId: setHold
      summary: Set or resolve collection hold with audit reason
      description: Every change increments revision and invalidates credentials. DISPUTE can only be
        cleared by evidence-led reconciliation, not a simple hold change. CLOSED parcel records
        never transfer.
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ParcelId"
      responses:
        "200":
          description: Success
          content:
