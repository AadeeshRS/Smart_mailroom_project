openapi: 3.0.3
info:
  title: Smart Mailroom API
  version: 1.0.0
  description: >-
    REST/JSON API for the college mailroom. Every operation declares `x-permission`
    (PUBLIC, AUTH, MEMBER, OPERATOR or ADMIN); the server enforces it in one place before
    validating input. Roles map to permissions as MEMBER → AUTH+MEMBER, OPERATOR →
    AUTH+OPERATOR, ADMIN → AUTH+OPERATOR+ADMIN. Authenticated calls send
    `Authorization: Bearer <token>`. Sessions last 7 days and slide while in use. Resources a
    member doesn't own return NOT_FOUND. Every response carries `Cache-Control: no-store`.
    Timestamps are UTC RFC 3339.
servers:
  - url: /v1
paths:
  /auth/register:
    post:
      operationId: register
      summary: Create a member account with a college email; emails a verification code
      description: >-
        Only emails in the configured college domains are accepted. Registering an email that
        already exists returns the same 202 (no account enumeration): an unverified account is
        updated with these details and gets a fresh code; a verified one is left unchanged.
      x-permission: PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
            examples:
              member: { $ref: '#/components/examples/RegisterRequest' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify the emailed code and start a session
      x-permission: PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyEmailInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/resend-code:
    post:
      operationId: resendCode
      summary: Send a new verification code to an unverified account (always 202)
      x-permission: PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      operationId: login
      summary: Email and password to a session
      description: >-
        Wrong email and wrong password give the same UNAUTHENTICATED error. EMAIL_NOT_VERIFIED and
        ACCOUNT_DISABLED are returned only after the password matches.
      x-permission: PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { $ref: '#/components/responses/Session' }
        default: { $ref: '#/components/responses/Error' }
  /auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Email a password reset code (always 202)
      x-permission: PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailInput' }
      responses:
        '202': { $ref: '#/components/responses/Accepted' }
        default: { $ref: '#/components/responses/Error' }
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Set a new password with the emailed code; revokes every session
      description: Also how operators and admins invited by an admin set their first password.
      x-permission: PUBLIC
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
  /auth/session:
    delete:
      operationId: logout
      summary: Revoke the current session
      x-permission: AUTH
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
  /hostels:
    get:
      operationId: listHostels
      summary: Hostel list, including inactive ones (the registration dropdown shows active only)
      x-permission: PUBLIC
      responses:
        '200':
          description: Hostels sorted by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostelList' }
        default: { $ref: '#/components/responses/Error' }
  /me:
    get:
      operationId: getMe
      summary: The signed-in user's profile
      x-permission: AUTH
      responses:
        '200': { $ref: '#/components/responses/User' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      operationId: updateMe
      summary: Edit the allowed profile fields; email and name can't be changed
      description: Send only the fields to change; `null` clears an optional field.
      x-permission: AUTH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMeInput' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        default: { $ref: '#/components/responses/Error' }
  /me/password:
    post:
      operationId: changePassword
      summary: Change password; revokes the user's other sessions
      x-permission: AUTH
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      operationId: listUsers
      summary: List and search users by name, email, ID number or phone
      x-permission: ADMIN
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of users sorted by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createUser
      summary: Create an operator or admin; emails them a code to set their password
      x-permission: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserInput' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        default: { $ref: '#/components/responses/Error' }
  /admin/users/{userId}:
    patch:
      operationId: updateUser
      summary: Change a user's role or deactivate them (revokes their sessions)
      description: >-
        An admin can't change their own role or deactivate themselves (SELF_CHANGE), and the last
        active admin can't be demoted or deactivated (LAST_ADMIN).
      x-permission: ADMIN
      parameters:
        - { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserInput' }
      responses:
        '200': { $ref: '#/components/responses/User' }
        default: { $ref: '#/components/responses/Error' }
  /admin/hostels:
    post:
      operationId: createHostel
      summary: Add a hostel
      x-permission: ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHostelInput' }
      responses:
        '200': { $ref: '#/components/responses/Hostel' }
        default: { $ref: '#/components/responses/Error' }
  /admin/hostels/{hostelId}:
    patch:
      operationId: updateHostel
      summary: Rename or (de)activate a hostel
      x-permission: ADMIN
      parameters:
        - { name: hostelId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateHostelInput' }
      responses:
        '200': { $ref: '#/components/responses/Hostel' }
        default: { $ref: '#/components/responses/Error' }
  /parcels/lookup:
    get:
      operationId: lookupParcel
      summary: What a scanned code is, its likely carrier, and parcels already logged with it
      description: >-
        The code is normalised (trimmed, uppercase, spaces removed). `kind` tells an order ID from an
        AWB by pattern; `carrier` is null when the format doesn't identify one. The operator can
        override both before saving. `request` is the open member request for this code, with the
        delivery OTP to read out to the delivery partner; this is the only place the OTP is shown.
      x-permission: OPERATOR
      parameters:
        - { name: code, in: query, required: true, schema: { $ref: '#/components/schemas/Code60' } }
      responses:
        '200':
          description: Lookup result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lookup' }
        default: { $ref: '#/components/responses/Error' }
  /parcels:
    get:
      operationId: listParcels
      summary: Search parcels, newest first (keyset pages)
      description: >-
        `q` matches the AWB, order ID, label name, label phone, recipient name or shelf.
        `unmatched=true` keeps parcels with no recipient.
      x-permission: OPERATOR
      parameters:
        - { $ref: '#/components/parameters/Q' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ParcelStatus' } }
        - { name: unmatched, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Cursor' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of parcels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelPage' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: intakeParcel
      summary: Log a parcel from its label, then match it to a member
      description: >-
        `id` is a UUID generated on the phone, so retrying the same intake returns the parcel already
        saved instead of creating a second one. At least one of `awb` and `orderId` is required.
        Matching first looks for an open member request with this AWB (or, failing that, this order ID):
        it links to the requester and clears the delivery OTP, unless the label's contact belongs only to
        other members, which sets matchFlag CONFLICT instead. With no request, the parcel links to the
        single verified member whose phone, alternate phone, college email or personal email matches the
        label; more than one sets matchFlag AMBIGUOUS.
      x-permission: OPERATOR
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IntakeInput' }
      responses:
        '200': { $ref: '#/components/responses/Parcel' }
        default: { $ref: '#/components/responses/Error' }
  /parcels/{parcelId}:
    get:
      operationId: getParcel
      summary: A parcel with its audit history
      x-permission: OPERATOR
      parameters:
        - { $ref: '#/components/parameters/ParcelId' }
      responses:
        '200':
          description: Parcel and history, oldest event first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParcelDetail' }
        default: { $ref: '#/components/responses/Error' }
  /parcels/{parcelId}/assign:
    post:
      operationId: assignParcel
      summary: Link an unmatched parcel to a member by hand
      description: Only parcels still in the mailroom with no recipient (else ALREADY_ASSIGNED or NOT_IN_MAILROOM).
      x-permission: OPERATOR
      parameters:
        - { $ref: '#/components/parameters/ParcelId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignInput' }
      responses:
        '200': { $ref: '#/components/responses/Parcel' }
        default: { $ref: '#/components/responses/Error' }
  /members:
    get:
      operationId: searchMembers
      summary: Find verified members by name, ID number, phone, room or email (at most 20)
      x-permission: OPERATOR
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
      responses:
        '200':
          description: Matching members, by name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
        default: { $ref: '#/components/responses/Error' }
  /me/parcels:
    get:
      operationId: listMyParcels
      summary: The member's parcels in the mailroom (ready) or already collected or returned (history)
      x-permission: MEMBER
      parameters:
        - name: view
          in: query
          required: true
          schema: { type: string, enum: [ready, history] }
      responses:
        '200':
          description: Newest first; history shows the latest 100
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyParcelList' }
        default: { $ref: '#/components/responses/Error' }
  /me/requests:
    get:
      operationId: listMyRequests
      summary: The member's requests, newest first (latest 100)
      x-permission: MEMBER
      responses:
        '200':
          description: Requests
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyRequestList' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createRequest
      summary: Ask for a parcel by its AWB; links it at once if it's already in the mailroom
      description: >-
        An order ID in the AWB field is refused (VALIDATION). One open request per AWB across all members (else REQUEST_EXISTS), and at most 20 open per
        member. If a parcel with this AWB (or order ID) is already in the mailroom and not linked to
        anyone, matching runs now and the request comes back MATCHED. Open requests expire after
        REQUEST_EXPIRY_DAYS (default 30), which clears the delivery OTP.
      x-permission: MEMBER
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestInput' }
      responses:
        '200': { $ref: '#/components/responses/Request' }
        default: { $ref: '#/components/responses/Error' }
  /me/requests/{requestId}:
    patch:
      operationId: updateRequest
      summary: Set or clear the delivery OTP of an open request (else REQUEST_CLOSED)
      x-permission: MEMBER
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateRequestInput' }
      responses:
        '200': { $ref: '#/components/responses/Request' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: cancelRequest
      summary: Cancel an open request and clear its delivery OTP (else REQUEST_CLOSED)
      x-permission: MEMBER
      parameters:
        - { $ref: '#/components/parameters/RequestId' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
  /me/collection:
    post:
      operationId: collectNow
      summary: 'Collect now: one code for all the member''s parcels waiting in the mailroom'
      description: >-
        Replaces the member's open code, if any. The code is valid for COLLECTION_CODE_MINUTES
        (default 15) and appears only in this response. NOT_FOUND when nothing is waiting. At most 6
        per minute (RATE_LIMITED).
      x-permission: MEMBER
      responses:
        '200':
          description: The code and the parcels it covers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyCollection' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      operationId: cancelCollection
      summary: Cancel the member's open code, if there is one
      x-permission: MEMBER
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
  /collections:
    get:
      operationId: listCollections
      summary: 'Giveaway queue: open codes, oldest first, each member once with their waiting parcels'
      x-permission: OPERATOR
      responses:
        '200':
          description: Open codes (at most 50)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionList' }
        default: { $ref: '#/components/responses/Error' }
  /collections/{collectionId}/verify:
    post:
      operationId: verifyCollection
      summary: Check the code the member shows; 5 wrong tries cancel it
      description: >-
        CODE_INVALID for a wrong code; CODE_EXPIRED once the code has expired, was cancelled or was
        replaced; ALREADY_COLLECTED once it has been used. A verified code stays usable for another
        COLLECTION_CODE_MINUTES while the operator ticks the parcels.
      x-permission: OPERATOR
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyCollectionInput' }
      responses:
        '200':
          description: The verified code with the member and their parcels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OperatorCollection' }
        default: { $ref: '#/components/responses/Error' }
  /collections/{collectionId}/complete:
    post:
      operationId: completeCollection
      summary: Hand over the ticked parcels of a verified code
      description: >-
        All or nothing: if any ticked parcel is no longer waiting for this member, nothing is handed
        over (ALREADY_COLLECTED), and so does a second complete. If a ticked parcel's label name is
        empty or shares no word with the member's name, `idChecked` must be true (else
        ID_CHECK_REQUIRED); the audit entry records it. Unticked parcels stay in the mailroom.
      x-permission: OPERATOR
      parameters:
        - { $ref: '#/components/parameters/CollectionId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteCollectionInput' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
  /admin/stats:
    get:
      operationId: getStats
      summary: Dashboard counts for one day, plus what's waiting now
      description: >-
        `dayStart` is local midnight on the admin's phone, so the day follows the mailroom's time zone
        with no server setting; the day is the 24 hours from it. Waiting parcels are bucketed by age:
        under 3 days, 3 days up to WAITING_TOO_LONG_DAYS (default 7), and longer.
      x-permission: ADMIN
      parameters:
        - { name: dayStart, in: query, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        default: { $ref: '#/components/responses/Error' }
  /admin/parcels/aging:
    get:
      operationId: listAging
      summary: Parcels waiting too long, oldest first, with the recipient's contact details (at most 200)
      x-permission: ADMIN
      parameters:
        - name: olderThanDays
          in: query
          description: Defaults to WAITING_TOO_LONG_DAYS (7)
          schema: { type: integer, minimum: 1, maximum: 365 }
      responses:
        '200':
          description: Waiting parcels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgingList' }
        default: { $ref: '#/components/responses/Error' }
  /admin/parcels/{parcelId}/remind:
    post:
      operationId: remindParcel
      summary: Remind the linked member that their parcel is waiting
      description: Only parcels in the mailroom (NOT_IN_MAILROOM) that are linked to a member (VALIDATION).
      x-permission: ADMIN
      parameters:
        - { $ref: '#/components/parameters/ParcelId' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
  /admin/parcels/{parcelId}/return:
    post:
      operationId: returnParcel
      summary: Mark a parcel returned to the sender; the linked member is told
      description: Only parcels still in the mailroom (else NOT_IN_MAILROOM).
      x-permission: ADMIN
      parameters:
        - { $ref: '#/components/parameters/ParcelId' }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        default: { $ref: '#/components/responses/Error' }
components:
  parameters:
    Q: { name: q, in: query, schema: { type: string, minLength: 1, maxLength: 100 } }
    Cursor: { name: cursor, in: query, schema: { $ref: '#/components/schemas/Id' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    ParcelId: { name: parcelId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    RequestId: { name: requestId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    CollectionId: { name: collectionId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
  responses:
    Ok:
      description: Done
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ok' }
    Accepted:
      description: Accepted; any email is sent in the background of this request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ok' }
    Session:
      description: A new session
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Session' }
    User:
      description: A user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/User' }
    Parcel:
      description: A parcel as operators see it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OperatorParcel' }
    Request:
      description: A request as its member sees it
      content:
        application/json:
          schema: { $ref: '#/components/schemas/MyRequest' }
    Hostel:
      description: A hostel
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Hostel' }
    Error:
      description: >-
        Error envelope. 400 validation or bad code; 401 not signed in; 403 role, unverified or
        disabled; 404 absent or not owned; 409 conflict; 429 rate limited; 500 unexpected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
  schemas:
    Id: { type: string, minLength: 1, maxLength: 64 }
    Email: { type: string, format: email, maxLength: 254 }
    Password: { type: string, minLength: 8, maxLength: 128 }
    Code: { type: string, pattern: '^[0-9]{6}$' }
    Phone:
      type: string
      minLength: 7
      maxLength: 20
      description: Any common format; stored as E.164 (+91 assumed for 10-digit numbers).
    Role: { type: string, enum: [MEMBER, OPERATOR, ADMIN] }
    MemberType: { type: string, enum: [STUDENT, STAFF] }
    Name: { type: string, minLength: 1, maxLength: 100 }
    IdNumber: { type: string, minLength: 1, maxLength: 40 }
    Room: { type: string, minLength: 1, maxLength: 20 }
    Ok:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok: { type: boolean, enum: [true] }
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password, name, memberType, idNumber, phone]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { $ref: '#/components/schemas/Password' }
        name: { $ref: '#/components/schemas/Name' }
        memberType: { $ref: '#/components/schemas/MemberType' }
        idNumber: { $ref: '#/components/schemas/IdNumber' }
        phone: { $ref: '#/components/schemas/Phone' }
        altPhone: { $ref: '#/components/schemas/Phone' }
        personalEmail: { $ref: '#/components/schemas/Email' }
        hostelId: { $ref: '#/components/schemas/Id' }
        roomNumber: { $ref: '#/components/schemas/Room' }
    VerifyEmailInput:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        code: { $ref: '#/components/schemas/Code' }
    EmailInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { $ref: '#/components/schemas/Email' }
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        password: { type: string, minLength: 1, maxLength: 128 }
    ResetPasswordInput:
      type: object
      additionalProperties: false
      required: [email, code, password]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        code: { $ref: '#/components/schemas/Code' }
        password: { $ref: '#/components/schemas/Password' }
    ChangePasswordInput:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128 }
        newPassword: { $ref: '#/components/schemas/Password' }
    UpdateMeInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        memberType: { $ref: '#/components/schemas/MemberType' }
        idNumber: { $ref: '#/components/schemas/IdNumber' }
        phone: { $ref: '#/components/schemas/Phone' }
        altPhone: { type: string, minLength: 7, maxLength: 20, nullable: true }
        personalEmail: { type: string, format: email, maxLength: 254, nullable: true }
        hostelId: { type: string, minLength: 1, maxLength: 64, nullable: true }
        roomNumber: { type: string, minLength: 1, maxLength: 20, nullable: true }
    CreateUserInput:
      type: object
      additionalProperties: false
      required: [email, name, role]
      properties:
        email: { $ref: '#/components/schemas/Email' }
        name: { $ref: '#/components/schemas/Name' }
        role: { type: string, enum: [OPERATOR, ADMIN] }
    UpdateUserInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        role: { $ref: '#/components/schemas/Role' }
        active: { type: boolean }
    CreateHostelInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: '#/components/schemas/Name' }
    UpdateHostelInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { $ref: '#/components/schemas/Name' }
        active: { type: boolean }
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - role
        - email
        - name
        - active
        - emailVerified
        - memberType
        - idNumber
        - phone
        - altPhone
        - personalEmail
        - hostelId
        - hostelName
        - roomNumber
        - createdAt
      properties:
        id: { $ref: '#/components/schemas/Id' }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string }
        name: { type: string }
        active: { type: boolean }
        emailVerified: { type: boolean }
        memberType: { type: string, enum: [STUDENT, STAFF, null], nullable: true }
        idNumber: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        altPhone: { type: string, nullable: true }
        personalEmail: { type: string, nullable: true }
        hostelId: { type: string, nullable: true }
        hostelName: { type: string, nullable: true }
        roomNumber: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    UserPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/User' } }
        nextCursor: { $ref: '#/components/schemas/Id' }
    Session:
      type: object
      additionalProperties: false
      required: [token, expiresAt, user]
      properties:
        token: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }
    Hostel:
      type: object
      additionalProperties: false
      required: [id, name, active]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        active: { type: boolean }
    HostelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Hostel' } }
    Code60: { type: string, minLength: 1, maxLength: 60 }
    Carrier:
      type: string
      enum: [DELHIVERY, BLUEDART, EKART, AMAZON, DTDC, XPRESSBEES, SHADOWFAX, INDIA_POST, OTHER]
    CodeKind: { type: string, enum: [AWB, ORDER_ID] }
    ParcelStatus: { type: string, enum: [IN_MAILROOM, COLLECTED, RETURNED] }
    IntakeInput:
      type: object
      additionalProperties: false
      required: [id, shelf]
      properties:
        id: { type: string, format: uuid }
        awb: { $ref: '#/components/schemas/Code60' }
        orderId: { $ref: '#/components/schemas/Code60' }
        carrier: { $ref: '#/components/schemas/Carrier' }
        labelName: { type: string, minLength: 1, maxLength: 100 }
        labelPhone: { type: string, minLength: 1, maxLength: 30, description: Kept only if it's a valid number }
        labelEmail: { type: string, minLength: 1, maxLength: 254 }
        labelHostel: { type: string, minLength: 1, maxLength: 100 }
        labelRoom: { type: string, minLength: 1, maxLength: 20 }
        shelf: { type: string, minLength: 1, maxLength: 20 }
        note: { type: string, minLength: 1, maxLength: 200 }
    AssignInput:
      type: object
      additionalProperties: false
      required: [userId]
      properties:
        userId: { $ref: '#/components/schemas/Id' }
    MemberSummary:
      type: object
      additionalProperties: false
      required: [id, name, email, idNumber, phone, hostelName, roomNumber]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string }
        idNumber: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        hostelName: { type: string, nullable: true }
        roomNumber: { type: string, nullable: true }
    MemberList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MemberSummary' } }
    OperatorParcel:
      type: object
      additionalProperties: false
      required:
        - id
        - awb
        - orderId
        - carrier
        - labelName
        - labelPhone
        - labelEmail
        - labelHostel
        - labelRoom
        - shelf
        - note
        - status
        - recipient
        - matchSource
        - matchFlag
        - receivedAt
        - receivedBy
        - collectedAt
      properties:
        id: { type: string }
        awb: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        carrier: { type: string, nullable: true, enum: [DELHIVERY, BLUEDART, EKART, AMAZON, DTDC, XPRESSBEES, SHADOWFAX, INDIA_POST, OTHER, null] }
        labelName: { type: string, nullable: true }
        labelPhone: { type: string, nullable: true }
        labelEmail: { type: string, nullable: true }
        labelHostel: { type: string, nullable: true }
        labelRoom: { type: string, nullable: true }
        shelf: { type: string }
        note: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        recipient:
          description: The linked member, or null (Ajv needs nullable next to type, so this repeats MemberSummary)
          nullable: true
          type: object
          additionalProperties: false
          required: [id, name, email, idNumber, phone, hostelName, roomNumber]
          properties:
            id: { $ref: '#/components/schemas/Id' }
            name: { type: string }
            email: { type: string }
            idNumber: { type: string, nullable: true }
            phone: { type: string, nullable: true }
            hostelName: { type: string, nullable: true }
            roomNumber: { type: string, nullable: true }
        matchSource: { type: string, nullable: true, enum: [REQUEST, CONTACT, MANUAL, null] }
        matchFlag: { type: string, nullable: true, enum: [AMBIGUOUS, CONFLICT, null] }
        receivedAt: { type: string, format: date-time }
        receivedBy: { type: string, description: The operator's name }
        collectedAt: { type: string, format: date-time, nullable: true }
    ParcelPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OperatorParcel' } }
        nextCursor: { $ref: '#/components/schemas/Id' }
    ParcelDetail:
      type: object
      additionalProperties: false
      required: [parcel, history]
      properties:
        parcel: { $ref: '#/components/schemas/OperatorParcel' }
        history:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [at, actor, action, detail]
            properties:
              at: { type: string, format: date-time }
              actor: { type: string }
              action: { type: string }
              detail: { type: string }
    Lookup:
      type: object
      additionalProperties: false
      required: [code, kind, carrier, existing]
      properties:
        code: { type: string }
        kind: { $ref: '#/components/schemas/CodeKind' }
        carrier: { type: string, nullable: true, enum: [DELHIVERY, BLUEDART, EKART, AMAZON, DTDC, XPRESSBEES, SHADOWFAX, INDIA_POST, OTHER, null] }
        existing:
          description: Parcels already logged with this code, newest first (at most 5). Non-empty means a likely duplicate.
          type: array
          items: { $ref: '#/components/schemas/OperatorParcel' }
        request: { $ref: '#/components/schemas/LookupRequest' }
    LookupRequest:
      type: object
      additionalProperties: false
      required: [id, member, orderId, deliveryOtp, createdAt]
      properties:
        id: { type: string }
        member: { $ref: '#/components/schemas/MemberSummary' }
        orderId: { type: string, nullable: true }
        deliveryOtp: { type: string, nullable: true, description: Read it out to the delivery partner }
        createdAt: { type: string, format: date-time }
    MyParcel:
      type: object
      additionalProperties: false
      required: [id, awb, orderId, carrier, status, receivedAt, collectedAt]
      properties:
        id: { type: string }
        awb: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        carrier: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/ParcelStatus' }
        receivedAt: { type: string, format: date-time }
        collectedAt: { type: string, format: date-time, nullable: true }
    MyParcelList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MyParcel' } }
    DeliveryOtp: { type: string, pattern: '^[0-9]{4,8}$', description: The OTP the courier sent the member }
    RequestStatus: { type: string, enum: [OPEN, MATCHED, CANCELLED, EXPIRED] }
    RequestInput:
      type: object
      additionalProperties: false
      required: [awb]
      properties:
        awb: { $ref: '#/components/schemas/Code60' }
        orderId: { $ref: '#/components/schemas/Code60' }
        deliveryOtp: { $ref: '#/components/schemas/DeliveryOtp' }
    UpdateRequestInput:
      type: object
      additionalProperties: false
      required: [deliveryOtp]
      properties:
        deliveryOtp: { type: string, pattern: '^[0-9]{4,8}$', nullable: true }
    MyRequest:
      type: object
      additionalProperties: false
      required: [id, awb, orderId, carrier, deliveryOtp, status, createdAt, expiresAt]
      properties:
        id: { type: string }
        awb: { type: string }
        orderId: { type: string, nullable: true }
        carrier: { type: string, nullable: true }
        deliveryOtp: { type: string, nullable: true }
        status: { $ref: '#/components/schemas/RequestStatus' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        parcel:
          description: >-
            Present once the parcel is linked to this member. A MATCHED request without it means the
            label points to someone else and the mailroom is checking.
          allOf: [{ $ref: '#/components/schemas/MyParcel' }]
    MyRequestList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/MyRequest' } }
    MyCollection:
      type: object
      additionalProperties: false
      required: [otp, expiresAt, parcels]
      properties:
        otp: { type: string, pattern: '^[0-9]{6}$' }
        expiresAt: { type: string, format: date-time }
        parcels: { type: array, items: { $ref: '#/components/schemas/MyParcel' } }
    HandoverParcel:
      type: object
      additionalProperties: false
      required: [id, awb, orderId, carrier, shelf, labelName, nameMatches, receivedAt]
      properties:
        id: { type: string }
        awb: { type: string, nullable: true }
        orderId: { type: string, nullable: true }
        carrier: { type: string, nullable: true }
        shelf: { type: string }
        labelName: { type: string, nullable: true }
        nameMatches:
          type: boolean
          description: The label name shares a word with the member's name. When false, check their ID card.
        receivedAt: { type: string, format: date-time }
    OperatorCollection:
      type: object
      additionalProperties: false
      required: [id, status, member, requestedAt, expiresAt, attemptsLeft, parcels]
      properties:
        id: { type: string }
        status: { type: string, enum: [PENDING, VERIFIED] }
        member: { $ref: '#/components/schemas/MemberSummary' }
        requestedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        attemptsLeft: { type: integer, minimum: 0, maximum: 5 }
        parcels:
          description: The member's parcels waiting in the mailroom now, oldest first
          type: array
          items: { $ref: '#/components/schemas/HandoverParcel' }
    CollectionList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/OperatorCollection' } }
    VerifyCollectionInput:
      type: object
      additionalProperties: false
      required: [otp]
      properties:
        otp: { $ref: '#/components/schemas/Code' }
    CompleteCollectionInput:
      type: object
      additionalProperties: false
      required: [parcelIds, idChecked]
      properties:
        parcelIds:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: { $ref: '#/components/schemas/Id' }
        idChecked: { type: boolean, description: The operator checked the member's college ID card }
    AdminStats:
      type: object
      additionalProperties: false
      required: [received, collected, waiting, waitingByAge, tooLongDays, unmatched, openRequests]
      properties:
        received: { type: integer, description: Parcels received that day }
        collected: { type: integer, description: Parcels collected that day }
        waiting: { type: integer, description: Parcels in the mailroom now }
        waitingByAge:
          type: object
          additionalProperties: false
          required: [underThreeDays, upToLimit, overLimit]
          properties:
            underThreeDays: { type: integer }
            upToLimit: { type: integer, description: 3 days up to tooLongDays }
            overLimit: { type: integer, description: Longer than tooLongDays }
        tooLongDays: { type: integer }
        unmatched: { type: integer, description: Parcels in the mailroom linked to nobody }
        openRequests: { type: integer }
    AgingList:
      type: object
      additionalProperties: false
      required: [olderThanDays, items]
      properties:
        olderThanDays: { type: integer }
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [parcel, daysWaiting, lastRemindedAt]
            properties:
              parcel: { $ref: '#/components/schemas/OperatorParcel' }
              daysWaiting: { type: integer }
              lastRemindedAt: { type: string, format: date-time, nullable: true }
    ErrorCode:
      type: string
      enum:
        - VALIDATION
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - EMAIL_NOT_VERIFIED
        - ACCOUNT_DISABLED
        - EMAIL_DOMAIN_NOT_ALLOWED
        - CODE_INVALID
        - PHONE_TAKEN
        - ID_NUMBER_TAKEN
        - EMAIL_TAKEN
        - NAME_TAKEN
        - LAST_ADMIN
        - SELF_CHANGE
        - ALREADY_ASSIGNED
        - NOT_IN_MAILROOM
        - REQUEST_EXISTS
        - REQUEST_CLOSED
        - CODE_EXPIRED
        - ALREADY_COLLECTED
        - ID_CHECK_REQUIRED
        - RATE_LIMITED
        - NETWORK
        - INTERNAL
      x-http-status-codes:
        VALIDATION: 400
        UNAUTHENTICATED: 401
        FORBIDDEN: 403
        NOT_FOUND: 404
        EMAIL_NOT_VERIFIED: 403
        ACCOUNT_DISABLED: 403
        EMAIL_DOMAIN_NOT_ALLOWED: 400
        CODE_INVALID: 400
        PHONE_TAKEN: 409
        ID_NUMBER_TAKEN: 409
        EMAIL_TAKEN: 409
        NAME_TAKEN: 409
        LAST_ADMIN: 409
        SELF_CHANGE: 409
        ALREADY_ASSIGNED: 409
        NOT_IN_MAILROOM: 409
        REQUEST_EXISTS: 409
        REQUEST_CLOSED: 409
        CODE_EXPIRED: 409
        ALREADY_COLLECTED: 409
        ID_CHECK_REQUIRED: 400
        RATE_LIMITED: 429
        NETWORK: 503
        INTERNAL: 500
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId, retryable]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            requestId: { type: string }
            retryable: { type: boolean }
  examples:
    RegisterRequest:
      summary: A student registering
      x-schema: RegisterInput
      value:
        email: asha.rao@college.example
        password: correct-horse-battery
        name: Asha Rao
        memberType: STUDENT
        idNumber: 23CS1001
        phone: '98765 43210'
        hostelId: hst_example
        roomNumber: B-214
    MeEdit:
      summary: Clearing the alternate phone
      x-schema: UpdateMeInput
      value: { roomNumber: B-215, altPhone: null }
    Intake:
      summary: A parcel logged from its label
      x-schema: IntakeInput
      value:
        id: 6f1c2b8e-3d4a-4f5b-9c7d-8e9f0a1b2c3d
        awb: EE123456789IN
        labelName: Asha Rao
        labelPhone: '98765 43210'
        shelf: A3
    Request:
      summary: A member asking for a parcel, with the courier's delivery OTP
      x-schema: RequestInput
      value: { awb: EE123456789IN, deliveryOtp: '4821' }
    Handover:
      summary: Handing over one of the member's two parcels after checking their ID card
      x-schema: CompleteCollectionInput
      value: { parcelIds: [6f1c2b8e-3d4a-4f5b-9c7d-8e9f0a1b2c3d], idChecked: true }
x-invalid-examples:
  - schema: CompleteCollectionInput
    value: { parcelIds: [], idChecked: false }
  - schema: CompleteCollectionInput
    value: { parcelIds: [p1] }
  - schema: RequestInput
    value: { orderId: OD123456789012 }
  - schema: RequestInput
    value: { awb: EE123456789IN, deliveryOtp: 12ab }
  - schema: IntakeInput
    value: { id: not-a-uuid, awb: X1, shelf: A1 }
  - schema: IntakeInput
    value: { id: 6f1c2b8e-3d4a-4f5b-9c7d-8e9f0a1b2c3d, awb: X1 }
  - schema: UpdateMeInput
    value: { email: someone.else@college.example }
  - schema: UpdateMeInput
    value: { name: New Name }
  - schema: UpdateMeInput
    value: {}
  - schema: RegisterInput
    value: { email: asha.rao@college.example, password: short, name: Asha, memberType: STUDENT, idNumber: X, phone: '9876543210' }
  - schema: VerifyEmailInput
    value: { email: asha.rao@college.example, code: '12345' }
  - schema: CreateUserInput
    value: { email: new.member@college.example, name: Someone, role: MEMBER }
