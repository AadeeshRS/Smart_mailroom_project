            maxLength: 100
            description: "Case-insensitive substring search of authorized records. Orders: merchant order
              ID/tracking. Parcels: ID, description, storage, physical reference. Staff parcel search also includes label identifiers; student search does not.
              Receipts: receipt/parcel/order IDs."
        - name: status
          in: query
          schema:
