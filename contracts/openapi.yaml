  /parcels/{parcelId}/handover:
    post:
      operationId: confirmHandover
      summary: Explicitly confirm physical handover or replay original receipt
      description: Staff only. Fresh authorization requires true physicalHandoverConfirmed and
        verification bound to current credential, parcel revision and STAFF SESSION; verification
        expires at min(2 minutes, credential expiry). Idempotency scope is staff ACCOUNT +
        confirmHandover + key; fingerprint includes exact parcelId, verificationId and
        physicalHandoverConfirmed. Persist the original request/key before attempting confirmation
        and keep it on uncertain outcome; never silently mint a fresh key. Replay lookup precedes
        verification/credential expiry and current lifecycle checks. A committed same-body result
        replays the original receipt after verification expiry, logout/login, process restart or
        CLOSED status. Different body/path gives 409 IDEMPOTENCY_CONFLICT. Handover mappings are
        retained for the lifetime of their retained receipt (stronger than ordinary 24-hour writes).
        Without a committed result, expired/missing verification gives 410 VERIFICATION_EXPIRED; it
        cannot create a handover. Holds/revision changes/credential changes/already-collected fresh
        attempts remain rejected. Recovery is account-scoped; no session token, OTP or QR secret is
        persisted by the client. Backend must atomically recheck, consume credential, close parcel,
        create one receipt and store idempotency result. Mock serialization is not database
        atomicity evidence.
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ParcelId"
