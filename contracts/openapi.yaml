  /parcels/{parcelId}/reconciliation:
    post:
      operationId: reconcileParcel
      summary: Reconcile with evidence checklist and recorded reason
      description: All checklist booleans true; reason at least 12 characters. expectedRevision must
        match. May resolve disputes or transfer an uncollected parcel with explicit audit and
        notifications; invalidates outstanding credentials. Cannot change CLOSED parcel ownership.
        Review policy is a proposed decision for independent approval; no screenshot/document
        upload. A resolved decision remains effective for the reviewed claims. New relevant claims
        or identifiers invalidate the reviewed evidence baseline and trigger a new hold; unrelated
        registrations do not. Required idempotencyKey. Scope is authenticated principal +
        operationId + key; canonical fingerprint includes path and semantic JSON body except the
        key, with sorted object keys. For 24 hours, same request replays the original response
        without repeating side effects, even if the current resource revision has changed; different
        body/path gives 409 IDEMPOTENCY_CONFLICT. Only successful writes retain results;
        validation/authorization/state errors do not reserve a key. Expired result entries may be
        removed and a later request treated as fresh, subject to domain constraints; clients must
        use a new key after 24 hours. Backend must commit resource changes and idempotency result
        together. A retry that changes data requires an explicit new operation and key, not silent
        mutation of an uncertain request.
      parameters:
        - name: parcelId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/ParcelId"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffParcel"
          headers:
            Cache-Control:
              description: All authentication, credential, verification, confirmation, account-owned and staff
                evidence responses, including errors, MUST use no-store. Demo adapters have no HTTP
                cache.
