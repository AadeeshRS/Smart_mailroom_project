        - STUDENT
    post:
      operationId: createOrder
      summary: Register expected order and re-evaluate stored parcels
      description: "Same student active platform/order duplicate: 409 DUPLICATE_ORDER. Cross-student
        overlapping claims retained as disputed, never first-claim allocation. New claims or
        tracking additions re-evaluate all unclosed relevant parcels, invalidate credentials and
        hold assigned parcels on new ambiguity/conflict. Late orders use identical matching
        safeguards. Required idempotencyKey. Scope is authenticated principal + operationId + key;
        canonical fingerprint includes path and semantic JSON body except the key, with sorted
        object keys. For 24 hours, same request replays the original response without repeating side
        effects, even if the current resource revision has changed; different body/path gives 409
        IDEMPOTENCY_CONFLICT. Only successful writes retain results; validation/authorization/state
        errors do not reserve a key. Expired result entries may be removed and a later request
        treated as fresh, subject to domain constraints; clients must use a new key after 24 hours.
        Backend must commit resource changes and idempotency result together. A retry that changes
        data requires an explicit new operation and key, not silent mutation of an uncertain
        request."
      parameters: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpectedOrder"
              examples:
                RegistrationSuccess:
                  $ref: "#/components/examples/RegistrationSuccess"
          headers:
            Cache-Control:
              description: All authentication, credential, verification, confirmation, account-owned and staff
                evidence responses, including errors, MUST use no-store. Demo adapters have no HTTP
                cache.
              schema:
                type: string
                enum:
