components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Provisioned demo sessions now; future college auth requires reviewed backend design.
  schemas:
    UserId:
      type: string
      pattern: ^usr_[A-Za-z0-9_-]+$
    OrderId:
      type: string
      pattern: ^ord_[A-Za-z0-9_-]+$
    ParcelId:
      type: string
      pattern: ^par_[A-Za-z0-9_-]+$
    NotificationId:
      type: string
      pattern: ^ntf_[A-Za-z0-9_-]+$
    CredentialId:
      type: string
      pattern: ^crd_[A-Za-z0-9_-]+$
    VerificationId:
      type: string
      pattern: ^ver_[A-Za-z0-9_-]+$
    ReceiptId:
      type: string
      pattern: ^rcp_[A-Za-z0-9_-]+$
    Timestamp:
      type: string
      format: date-time
      description: RFC3339 UTC timestamp; responses end in Z.
    Platform:
      type: string
      enum:
        - AMAZON
        - FLIPKART
        - MYNTRA
        - OTHER
    OrderStatus:
      type: string
      enum:
        - PENDING
        - MATCHED
        - CANCELLED
    ParcelStatus:
      type: string
      enum:
        - RECEIVED
        - AWAITING_MATCH
        - AWAITING_COLLECTION
        - CLOSED
    Hold:
      type: string
      enum:
        - NONE
        - REVIEW
        - DISPUTE
    MatchOutcome:
      type: string
      enum:
        - MATCHED
        - NO_MATCH
        - AMBIGUOUS
        - CONFLICT
        - DUPLICATE
        - INSUFFICIENT_EVIDENCE
    CredentialState:
      type: string
      enum:
        - NONE
        - ACTIVE
        - EXPIRED
        - INVALIDATED
        - CONSUMED
    ErrorCode:
      type: string
      enum:
        - VALIDATION
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - FORBIDDEN
        - NOT_FOUND
        - DUPLICATE_ORDER
        - DUPLICATE_INTAKE
        - CANCELLATION_INELIGIBLE
        - COLLECTION_HOLD
        - NOT_ELIGIBLE
        - CREDENTIAL_ACTIVE
        - ISSUANCE_RETRY_UNAVAILABLE
        - INVALID_CREDENTIAL
        - CREDENTIAL_EXPIRED
        - CREDENTIAL_INVALIDATED
        - ATTEMPTS_EXCEEDED
        - VERIFICATION_EXPIRED
        - REVISION_CHANGED
        - ALREADY_COLLECTED
        - CONCURRENT_CONFLICT
        - IDEMPOTENCY_CONFLICT
        - NETWORK
        - PERSISTENCE
    ErrorEnvelope:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
            - code
            - message
            - requestId
            - retryable
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            requestId:
              type: string
            retryable:
              type: boolean
    Profile:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
        - role
      properties:
        id:
          $ref: "#/components/schemas/UserId"
        name:
          type: string
        email:
          type: string
          format: email
        studentNumber:
          type: string
        role:
          type: string
          enum:
            - STUDENT
            - STAFF
    Session:
      type: object
      additionalProperties: false
      required:
        - token
        - profile
        - expiresAt
      properties:
        token:
          type: string
        profile:
          $ref: "#/components/schemas/Profile"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    LoginInput:
      type: object
      additionalProperties: false
      required:
        - accountId
        - passcode
      properties:
        accountId:
          $ref: "#/components/schemas/UserId"
        passcode:
          type: string
    Ok:
      type: object
      additionalProperties: false
      required:
        - ok
      properties:
        ok:
          type: boolean
    Identifier:
      type: object
      additionalProperties: false
      required:
        - kind
        - namespace
        - value
      properties:
        kind:
          type: string
          enum:
            - ORDER_ID
            - TRACKING
        namespace:
          type: string
          minLength: 1
          maxLength: 40
        value:
          type: string
          minLength: 1
          maxLength: 100
      description: ORDER_ID namespace is the selected platform; TRACKING namespace is the carrier.
        Namespace and values normalize by trim + uppercase in this demo. OTHER platform always
        requires staff review. Carrier alias/normalization policy needs backend review.
    TrackingReference:
      type: object
      additionalProperties: false
      required:
        - kind
        - namespace
        - value
      properties:
        kind:
          type: string
          enum:
            - TRACKING
        namespace:
          type: string
          minLength: 1
          maxLength: 40
        value:
          type: string
          minLength: 1
          maxLength: 100
    CreateOrder:
      type: object
      additionalProperties: false
      required:
        - platform
        - merchantOrderId
        - tracking
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        merchantOrderId:
          type: string
          minLength: 1
          maxLength: 100
        tracking:
          type: array
          items:
            $ref: "#/components/schemas/TrackingReference"
    AddTracking:
      type: object
      additionalProperties: false
      required:
        - reference
      properties:
        reference:
          $ref: "#/components/schemas/TrackingReference"
    ExpectedOrder:
      type: object
      additionalProperties: false
      required:
        - id
        - studentId
        - platform
        - merchantOrderId
        - tracking
        - status
        - createdAt
        - parcelIds
        - duplicateClaim
      properties:
        id:
          $ref: "#/components/schemas/OrderId"
        studentId:
          $ref: "#/components/schemas/UserId"
        platform:
          $ref: "#/components/schemas/Platform"
        merchantOrderId:
          type: string
        tracking:
          type: array
          items:
            $ref: "#/components/schemas/TrackingReference"
        status:
          $ref: "#/components/schemas/OrderStatus"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        parcelIds:
          type: array
          items:
            $ref: "#/components/schemas/ParcelId"
        duplicateClaim:
          type: boolean
    IntakeInput:
      type: object
      additionalProperties: false
      required:
        - identifiers
        - recipientEmail
        - recipientStudentNumber
        - recipientName
        - description
        - storageLocation
        - physicalReference
        - source
        - labelReviewed
      properties:
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        recipientEmail:
          type: string
        recipientStudentNumber:
          type: string
        recipientName:
          type: string
        description:
          type: string
          minLength: 1
          maxLength: 160
        storageLocation:
          type: string
          minLength: 1
          maxLength: 80
        physicalReference:
          type: string
          minLength: 1
          maxLength: 80
        source:
          type: string
          enum:
            - MANUAL
            - CAMERA
        labelReviewed:
          type: boolean
    AuditEvent:
      type: object
      additionalProperties: false
      required:
        - at
        - action
        - actorId
        - reason
      properties:
        at:
          $ref: "#/components/schemas/Timestamp"
        action:
          type: string
        actorId:
          $ref: "#/components/schemas/UserId"
        reason:
          type: string
    Parcel:
      type: object
      additionalProperties: false
      required:
        - id
        - identifiers
        - recipientEmail
        - recipientStudentNumber
        - recipientName
        - description
        - storageLocation
        - physicalReference
        - source
        - status
        - receivedAt
        - revision
        - matchOutcome
        - matchExplanation
        - hold
        - holdReason
        - collectionEligible
        - credentialState
        - audit
      properties:
        id:
          $ref: "#/components/schemas/ParcelId"
        identifiers:
          type: array
          items:
            $ref: "#/components/schemas/Identifier"
        recipientEmail:
          type: string
        recipientStudentNumber:
          type: string
        recipientName:
          type: string
        description:
          type: string
        storageLocation:
          type: string
        physicalReference:
          type: string
        source:
          type: string
          enum:
            - MANUAL
            - CAMERA
        status:
          $ref: "#/components/schemas/ParcelStatus"
        receivedAt:
          $ref: "#/components/schemas/Timestamp"
        orderId:
          $ref: "#/components/schemas/OrderId"
        studentId:
          $ref: "#/components/schemas/UserId"
        revision:
          type: integer
          minimum: 1
        matchOutcome:
          $ref: "#/components/schemas/MatchOutcome"
        matchExplanation:
          type: string
        hold:
          $ref: "#/components/schemas/Hold"
        holdReason:
          type: string
        collectionEligible:
          type: boolean
        credentialState:
          $ref: "#/components/schemas/CredentialState"
        audit:
          type: array
          items:
            $ref: "#/components/schemas/AuditEvent"
        receiptId:
          $ref: "#/components/schemas/ReceiptId"
    Candidate:
      type: object
      additionalProperties: false
      required:
        - order
        - student
        - comparable
        - corroborated
        - conflicts
      properties:
        order:
          $ref: "#/components/schemas/ExpectedOrder"
        student:
          $ref: "#/components/schemas/Profile"
        comparable:
          type: boolean
        corroborated:
          type: boolean
        conflicts:
          type: array
          items:
            type: string
    ParcelReview:
      type: object
      additionalProperties: false
      required:
        - parcel
        - candidates
      properties:
        parcel:
          $ref: "#/components/schemas/Parcel"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
    ReconcileInput:
      type: object
      additionalProperties: false
      required:
        - orderId
        - expectedRevision
        - identifierReviewed
        - recipientVerified
        - conflictsResolved
        - reason
      properties:
        orderId:
          $ref: "#/components/schemas/OrderId"
        expectedRevision:
          type: integer
          minimum: 1
        identifierReviewed:
          type: boolean
        recipientVerified:
          type: boolean
        conflictsResolved:
          type: boolean
        reason:
          type: string
          minLength: 12
          maxLength: 500
    HoldInput:
      type: object
      additionalProperties: false
      required:
        - hold
        - reason
        - expectedRevision
      properties:
        hold:
          $ref: "#/components/schemas/Hold"
        reason:
          type: string
          minLength: 12
          maxLength: 500
        expectedRevision:
          type: integer
          minimum: 1
    Notification:
      type: object
      additionalProperties: false
      required:
        - id
        - studentId
        - parcelId
        - title
        - message
        - createdAt
        - inAppAvailable
        - externalDelivery
        - simulatedExternal
      properties:
        id:
          $ref: "#/components/schemas/NotificationId"
        studentId:
          $ref: "#/components/schemas/UserId"
        parcelId:
          $ref: "#/components/schemas/ParcelId"
        title:
          type: string
        message:
          type: string
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        readAt:
          $ref: "#/components/schemas/Timestamp"
        inAppAvailable:
          type: boolean
        externalDelivery:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - DELIVERED
            - FAILED
        simulatedExternal:
          type: boolean
    IssueInput:
      type: object
      additionalProperties: false
      required:
        - idempotencyKey
        - replace
      properties:
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
        replace:
          type: boolean
    QrPayload:
      type: object
      additionalProperties: false
      required:
        - v
        - credentialRef
        - token
      properties:
        v:
          type: integer
          enum:
            - 1
        credentialRef:
          $ref: "#/components/schemas/CredentialId"
        token:
          type: string
          minLength: 16
    Credential:
      type: object
      additionalProperties: false
      required:
        - id
        - parcelId
        - otp
        - qr
        - issuedAt
        - expiresAt
      properties:
        id:
          $ref: "#/components/schemas/CredentialId"
        parcelId:
          $ref: "#/components/schemas/ParcelId"
        otp:
          type: string
          pattern: ^[0-9]{6}$
        qr:
          $ref: "#/components/schemas/QrPayload"
        issuedAt:
          $ref: "#/components/schemas/Timestamp"
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
    VerifyInput:
      type: object
      additionalProperties: false
      required:
        - method
      properties:
        method:
          type: string
          enum:
            - OTP
            - QR
        otp:
          type: string
          pattern: ^[0-9]{6}$
        qr:
          $ref: "#/components/schemas/QrPayload"
      description: method OTP requires otp and no qr; method QR requires qr and no otp. Extra secret
        fields are not accepted by a future HTTP adapter. Mock validates the selected method.
    Verification:
      type: object
      additionalProperties: false
      required:
        - id
        - parcelId
        - credentialId
        - parcelRevision
        - expiresAt
        - student
        - parcel
      properties:
        id:
          $ref: "#/components/schemas/VerificationId"
        parcelId:
          $ref: "#/components/schemas/ParcelId"
        credentialId:
          $ref: "#/components/schemas/CredentialId"
        parcelRevision:
          type: integer
          minimum: 1
        expiresAt:
          $ref: "#/components/schemas/Timestamp"
        student:
          $ref: "#/components/schemas/Profile"
        parcel:
          $ref: "#/components/schemas/Parcel"
    ConfirmInput:
      type: object
      additionalProperties: false
      required:
        - verificationId
        - physicalHandoverConfirmed
        - idempotencyKey
      properties:
        verificationId:
          $ref: "#/components/schemas/VerificationId"
        physicalHandoverConfirmed:
          type: boolean
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
    Receipt:
      type: object
      additionalProperties: false
      required:
        - id
        - parcelId
        - orderId
        - studentId
        - staffId
        - confirmedAt
        - storageLocation
        - verificationId
      properties:
        id:
          $ref: "#/components/schemas/ReceiptId"
        parcelId:
          $ref: "#/components/schemas/ParcelId"
        orderId:
          $ref: "#/components/schemas/OrderId"
        studentId:
          $ref: "#/components/schemas/UserId"
        staffId:
          $ref: "#/components/schemas/UserId"
        confirmedAt:
          $ref: "#/components/schemas/Timestamp"
        storageLocation:
          type: string
        verificationId:
          $ref: "#/components/schemas/VerificationId"
    Confirmation:
      type: object
      additionalProperties: false
      required:
        - receipt
        - replayed
      properties:
        receipt:
          $ref: "#/components/schemas/Receipt"
        replayed:
          type: boolean
    Guide:
      type: object
      additionalProperties: false
      required:
        - platform
        - title
        - steps
        - caution
      properties:
        platform:
          $ref: "#/components/schemas/Platform"
        title:
          type: string
        steps:
          type: array
          items:
            type: string
        caution:
          type: string
    OrderPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ExpectedOrder"
        nextCursor:
          type: string
    ParcelPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Parcel"
        nextCursor:
          type: string
    NotificationPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: string
    ReceiptPage:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Receipt"
        nextCursor:
          type: string
  responses:
    Error:
      description: "Error envelope. HTTP mapping: 400 validation; 401 authentication/session; 403 role;
        404 resource absent or not owned; 409 duplicate, lifecycle, revision, idempotency or
        concurrent conflict; 410 expired credential/verification; 423 collection hold; 429 five
        failed OTP attempts; 503 network/persistence. Operation descriptions define specific codes."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
