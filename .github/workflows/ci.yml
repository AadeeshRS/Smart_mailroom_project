name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: contracts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: contracts/package-lock.json }
      - run: npm ci
      - run: npm run generate
      - run: npm run validate
      - run: npm run check
      - name: Generated files are committed
        run: git diff --exit-code -- generated ../mobile/src/api/routes.generated.ts

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:17
        env: { POSTGRES_USER: mailroom_admin, POSTGRES_PASSWORD: ci, POSTGRES_DB: smart_mailroom_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mailroom_admin" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only throwaway values; the database lives only for this job.
      DATABASE_URL: postgresql://mailroom_admin:ci@localhost:5432/smart_mailroom_test
      NODE_ENV: test
      DEMO_ENABLED: 'true'
      DEMO_PASSCODE: ci-demo-passcode
      CREDENTIAL_PEPPER: ci-only-pepper-0123456789abcdef0123456789abcdef
      HOST: 127.0.0.1
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: api/package-lock.json }
      - run: npm ci
      - run: npm run generate
      - run: npm run migrate
      - run: npm run build
      - run: npm test
      - run: npm run format:check

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
